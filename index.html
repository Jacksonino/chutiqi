<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>智能数学出题器</title>

  <!-- PWA：可添加到主屏幕 / 打包成 App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="出题器" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />

  <!-- KaTeX 数学公式渲染 + Markdown 排版（从公共 CDN 加载） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- 导出图片 + 函数图像绘制 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12/lib/browser/math.js"></script>

  <style>
    :root {
      --brand: #2f6fed;
      --brand-dark: #1f57c4;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.6; padding-bottom: 40px;
    }
    header {
      background: linear-gradient(135deg, #2f6fed, #5a8bff);
      color: #fff; padding: 18px 16px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
    .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .key-btn { flex-shrink: 0; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }

    main { max-width: 640px; margin: 0 auto; padding: 14px; }

    .card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    /* 模式切换 */
    .tabs { display: flex; gap: 8px; }
    .tab {
      flex: 1; text-align: center; padding: 11px 4px;
      background: #eef2fb; color: #475569; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1.5px solid transparent; user-select: none;
    }
    .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .hint { margin-top: 12px; font-size: 13px; color: var(--muted); background: #f8fafc; border-radius: 10px; padding: 10px 12px; }

    /* 输入 */
    textarea {
      width: 100%; min-height: 130px; resize: vertical;
      border: 1.5px solid var(--line); border-radius: 12px;
      padding: 12px; font-size: 15px; font-family: inherit; color: var(--text);
      outline: none; background: #fff;
    }
    textarea:focus { border-color: var(--brand); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .field { flex: 1; min-width: 100px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    select, input[type=number] {
      width: 100%; padding: 9px 8px; font-size: 15px;
      border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
      outline: none;
    }
    .seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg-btn { flex: 1; padding: 9px 0; font-size: 15px; border: none; background: #fff; color: #475569; cursor: pointer; }
    .seg-btn.active { background: var(--brand); color: #fff; }
    .check { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 12px; color: var(--text); }
    .check input { width: 18px; height: 18px; }

    /* 按钮 */
    button.primary {
      width: 100%; padding: 14px; margin-top: 12px;
      background: var(--brand); color: #fff; border: none; border-radius: 12px;
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    button.primary:active { background: var(--brand-dark); }
    button.primary:disabled { background: #9db8f5; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 20px; }
    .status.error { color: #dc2626; }

    /* 输出 */
    .output { display: none; }
    .output.show { display: block; }
    .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .out-head .ttl { font-size: 14px; font-weight: 700; color: #475569; }
    .mini-btn {
      border: 1px solid var(--line); background: #fff; color: #475569;
      border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .out-body {
      background: #fbfcfe; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; font-size: 15px; overflow-wrap: break-word;
    }
    .out-body h2 { font-size: 16px; color: var(--brand-dark); margin: 16px 0 8px; }
    .out-body h3 { font-size: 15px; margin: 14px 0 6px; }
    .out-body p { margin: 8px 0; }
    .out-body .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .out-body ul, .out-body ol { padding-left: 22px; }
    .out-head > div { display: flex; gap: 6px; flex-wrap: wrap; }

    /* 函数图像 */
    .graph-wrap { margin: 10px 0; text-align: center; }
    .graph-wrap canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

    /* 图片导出弹层 */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; border-radius: 14px; padding: 16px; max-width: 94vw; max-height: 94vh; overflow: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 700; color: #475569; }
    .modal-box img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

    /* 打印/存PDF：只保留出题结果 */
    @media print {
      header, .card:not(.output), footer, .out-head .mini-btn, .modal { display: none !important; }
      body { background: #fff; padding: 0; }
      main { max-width: none; padding: 0; }
      .output { display: block !important; }
      .out-body { border: none; background: #fff; padding: 0; }
    }

    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <div>
        <h1>📐 智能数学出题器</h1>
        <p>出卷 · 仿例题 · 按知识点，都能出题</p>
      </div>
      <button class="key-btn" id="keyBtn">🔑 密钥</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="tabs" id="tabs">
        <div class="tab active" data-mode="exam">📝 出卷</div>
        <div class="tab" data-mode="mimic">📋 仿例题</div>
        <div class="tab" data-mode="knowledge">📚 按知识点</div>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="card">
      <textarea id="input" placeholder="在这里输入内容…"></textarea>

      <div class="controls">
        <div class="field">
          <label>年级 / 学段</label>
          <select id="grade">
            <option value="不限" selected>不限</option>
            <option value="小学">小学</option>
            <option value="初一">初一</option>
            <option value="初二">初二</option>
            <option value="初三">初三</option>
            <option value="高一">高一</option>
            <option value="高二">高二</option>
            <option value="高三">高三</option>
            <option value="大学/考研">大学/考研</option>
          </select>
        </div>
        <div class="field">
          <label>题目数量</label>
          <input type="number" id="count" value="5" min="1" max="20" />
        </div>
        <div class="field">
          <label>难度</label>
          <select id="difficulty">
            <option value="不限">不限</option>
            <option value="基础">基础</option>
            <option value="中等" selected>中等</option>
            <option value="较难">较难</option>
            <option value="压轴">压轴</option>
          </select>
        </div>
        <div class="field">
          <label>模型速度</label>
          <div class="seg" id="modelSeg">
            <button type="button" class="seg-btn active" data-model="fast" title="deepseek-ai/DeepSeek-V3（快）">快</button>
            <button type="button" class="seg-btn" data-model="slow" title="deepseek-ai/DeepSeek-R1（慢，推理模型）">慢</button>
          </div>
        </div>
      </div>

      <div class="check">
        <input type="checkbox" id="answer" checked />
        <label for="answer">同时给出【答案与解析】（老师自己核对用，学生看不到）</label>
      </div>

      <button class="primary" id="generate">开始出题</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card output" id="output">
      <div class="out-head">
        <span class="ttl">📄 出题结果</span>
        <div>
          <button class="mini-btn" id="copy">复制</button>
          <button class="mini-btn" id="exportImg">导出图片</button>
          <button class="mini-btn" id="exportPdf">存为PDF</button>
        </div>
      </div>
      <div class="out-body" id="outBody"></div>
    </div>

    <!-- 导出图片预览弹层 -->
    <div class="modal" id="imgModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>长按图片保存到相册</span>
          <button class="mini-btn" id="closeModal">关闭</button>
        </div>
        <img id="imgPreview" alt="出题图片" />
        <a id="imgDownload" download="出题.png" class="mini-btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none;">点此下载图片</a>
      </div>
    </div>

    <!-- 密钥输入弹层（存在本机浏览器，不上传仓库） -->
    <div class="modal" id="keyModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>🔑 输入 API 密钥</span>
          <button class="mini-btn" id="keyCancel">取消</button>
        </div>
        <p style="font-size:13px;color:#6b7280;margin:0 0 10px;">密钥只保存在<strong>本机浏览器</strong>里，不会出现在仓库或网页源码中。可在 cloud.siliconflow.cn 后台获取。</p>
        <input type="text" id="keyInput" placeholder="粘贴 sk- 开头的密钥" style="width:100%;padding:11px;font-size:15px;border:1.5px solid #e5e7eb;border-radius:10px;outline:none;" />
        <div id="keyErr" style="color:#dc2626;font-size:13px;margin-top:8px;min-height:16px;"></div>
        <button class="primary" id="keySave" style="margin-top:10px;">保存密钥</button>
      </div>
    </div>

    <!-- PDF 命名弹层 -->
    <div class="modal" id="nameModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>📄 给 PDF 起个名字</span>
          <button class="mini-btn" id="nameCancel">取消</button>
        </div>
        <input type="text" id="pdfName" value="出题" style="width:100%;padding:11px;font-size:15px;border:1.5px solid #e5e7eb;border-radius:10px;outline:none;" />
        <button class="primary" id="nameOk" style="margin-top:10px;">生成 PDF</button>
      </div>
    </div>

    <footer>内部教学工具 · 题目由 AI 生成，建议老师过目后再使用</footer>
  </main>

  <script src="config.js"></script>
  <script>
  (function () {
    // ---------- 读取配置 ----------
    var cfg = (window.APP_CONFIG || {});
    var LS_KEY = "chutiqi_api_key";
    var storedKey = "";
    try { storedKey = localStorage.getItem(LS_KEY) || ""; } catch (e) {}
    var API_KEY = storedKey || (cfg.apiKey || "");
    var BASE_URL = cfg.baseUrl || "https://api.siliconflow.cn/v1/chat/completions";
    // 有 proxyUrl 就走服务端代理（部署版：密钥在服务端，且无跨域问题）；
    // 否则本地用 apiKey 直连硅基流动；两者都没有则回退到同源 /api/chat。
    var API_URL = cfg.proxyUrl || (API_KEY ? BASE_URL : "/api/chat");
    var MODEL_FAST = cfg.modelFast || "deepseek-ai/DeepSeek-V3";
    var MODEL_SLOW = cfg.modelSlow || "deepseek-ai/DeepSeek-R1";
    var currentModel = MODEL_FAST;
    var TEMPERATURE = (typeof cfg.temperature === "number") ? cfg.temperature : 0.6;
    var MAX_TOKENS = cfg.maxTokens || 4096;

    function isReasoningModel(m) {
      var s = (m || "").toLowerCase();
      return s.indexOf("r1") !== -1 || s.indexOf("reasoner") !== -1 || s.indexOf("reasoning") !== -1 || s.indexOf("qwq") !== -1;
    }

    function $(id) { return document.getElementById(id); }

    // ---------- 三种模式 ----------
    var currentMode = "exam";
    var HINTS = {
      exam: "输入出卷范围，例如：初一上册第二~三单元、九年级期中、高一第一学期期末……我会按该范围的教材目录自动组织知识点，出一张完整试卷（选择+填空+解答，含分值）。",
      mimic: "粘贴一道例题（可含题目和答案）。我会先分析它的知识点和题型，再给你出：①同类型题 ②举一反三题 ③关联知识点题。",
      knowledge: "输入一个知识点，例如：一元一次方程、二次函数、勾股定理、因式分解、三角函数……再在上面选好年级，我会按该知识点的常见题型出题。"
    };
    var PLACEHOLDERS = {
      exam: "示例：\n出一张初一上册第二~三单元的单元测试卷",
      mimic: "示例：\n解方程 2x + 3 = 11，求 x 的值。",
      knowledge: "示例：\n一元一次方程"
    };

    // ---------- 系统提示词（核心） ----------
    var SYSTEM_PROMPT = [
      "你是一名有 20 年教学经验的中学数学命题老师，精通初中、高中数学教材、考纲和各地常见题型，出题严谨、数据自洽、不超纲。",
      "",
      "【硬性规则，必须遵守】",
      "1. 所有数学公式、分式、根号、指数、几何记号，一律用 LaTeX 书写：行内用 $...$，独立成行用 $$...$$。例如 $\\frac{1}{2}$、$x^2+2x+1=0$、$\\sqrt{2}$。禁止用纯文本堆砌公式。",
      "1b. 只使用最基础的 LaTeX 命令（如 \\frac、乘方 ^、\\sqrt、\\times、\\div、\\pm、希腊字母、=<>≤≥≠ 等）；禁止使用复杂环境（\\begin{aligned}、矩阵、\\begin{cases} 等），以免在网页里显示成乱码或源码。",
      "2. 题目条件完整、无歧义、数据合理；应用题数值符合实际（人数、个数应为整数等）。",
      "3. 严格遵循用户指定的年级/学段、题目数量、题型和难度（难度分级见下方标准）；未指定难度时默认中等。",
      "4. 每道题出完后在心里验算一遍，确保可解、答案正确。",
      "5. 用 Markdown 排版：用 ## 标记分类小节，用 ### 标记每道题的题号，每题单独成段，题后可用小字标注【题型】【考点】。",
      "",
      "【难度分级标准（必须严格执行，宁难勿易）】",
      "- 基础：单一知识点，一步到两步直接计算，套公式/定义即可。",
      "- 中等：单一知识点，2~3 步，需要一定变形或转换（移项、配方、换元、拆项等）。",
      "- 较难：1~2 个知识点结合，多步推理，含参数、分类讨论或逆向设问。",
      "- 压轴：多个知识点综合、通常 4 步以上；必须具备压轴题特征——数形结合、分类讨论、求最值/取值范围、存在性问题、动点问题、几何代数结合等；以解答题为主，设问层层递进（第1问基础、第2问中等、第3问较难）。",
      "特别强调：当用户选「压轴」时，宁可偏难也不许偏易；每道压轴题必须至少结合两个知识点，并至少含一个较难设问。",
      "",
      "【带图题目 / 函数图像】",
      "需要画函数图像（一次、二次、反比例、三角、对数等）时，在题目下方用 fenced 代码块给出函数表达式，前端会自动画图，题目里写「如图」即可：",
      "```graph",
      "f1(x) = x^2 - 2*x - 3",
      "f2(x) = x + 1",
      "```",
      "规则：每行一个函数，等号左边是名字（可有可无），右边是表达式；自变量一律用 x；乘方用 ^（如 x^2）；乘号必须写 *（如 2*x）；除号用 /（如 1/x）；可用 sin(x)、cos(x)、tan(x)、sqrt(x)、abs(x)、ln(x)。",
      "注意：不要画几何图形（三角形、圆等），本工具暂时只能画函数图像；几何题请用文字把图形条件描述清楚。",
      "",
      "【三种出题模式】",
      "",
      "模式A【仿例题模式】：用户给一道例题。你要：",
      "1. 先用一句话分析：例题的知识点、题型、难度、适合年级。",
      "2. 出「同类型题」：解题方法和结构完全一致，只替换数字/数据/具体对象，难度不变。",
      "3. 出「举一反三题」：同一知识点，但更换情境、更换问法、逆向设问或改变一个条件，难度比原题高一档。",
      "4. 出「关联知识点题」：把该知识点与相邻或前置知识点结合出题。",
      "每类题用 ## 小标题分隔（如 ## 同类型题），每题用 ### 编号，并标注【题型】【考点】。",
      "",
      "模式B【知识点出题模式】：用户给一个知识点。你要：",
      "1. 先列出该知识点下最常见的几种题型。",
      "2. 每种题型各出一道题，从易到难排列，尽量覆盖填空、选择、计算、解答/应用等常见形式。",
      "每题用 ### 编号，并标注【题型】【考点】。",
      "",
      "模式C【出卷模式】：用户给一个出卷范围（如「初一上册第二~三单元」「九年级期中」「高一期末」）。你要：",
      "1. 先判断教材版本（用户没说就默认人教版），按该版本教材目录，简要列出该范围内涉及的知识点。",
      "2. 模仿常见单元卷/期中卷/期末卷，出一张结构完整的试卷，用 ## 分大题、用 ### 给每道题编号：",
      "   - 试卷标题（如「七年级数学上册 第二~三单元测试卷」）+ 说明行（满分、考试时间）。",
      "   - 一、选择题（约 8~10 题，每题 3 分，含 A/B/C/D 四个选项）。",
      "   - 二、填空题（约 6~8 题，每题 3 分）。",
      "   - 三、解答题（约 5~6 题，每题 6~10 分不等，要写出解题步骤）。",
      "3. 满分合计 100 分或 120 分（在说明里写清，并保证各题分值加起来等于总分）。",
      "4. 难度分布：基础约 60%、中等约 25%、较难约 15%；覆盖该范围内所有主要知识点，不遗漏。",
      "5. 每道题标注分值；若用户要求附答案，试卷末尾单独给一份【参考答案与评分标准】。",
      "",
      "【关于答案】",
      "- 如果用户要求附答案，在每道题后给出【答案与解析】，解析写出关键步骤。",
      "- 如果用户要求“只出题目不出答案”，则绝对不要给出任何答案或提示。"
    ].join("\n");

    // ---------- 组装用户消息 ----------
    function buildUserMessage() {
      var input = $("input").value.trim();
      var grade = $("grade").value;
      var count = ($("count").value || 5);
      var difficulty = $("difficulty").value;
      var withAnswer = $("answer").checked;

      var gradeStr = (grade && grade !== "不限") ? "年级/学段：" + grade : "";
      var diffStr = (difficulty && difficulty !== "不限") ? "难度：" + difficulty : "";
      var ansStr = withAnswer ? "请为每道题附上【答案与解析】，解析写出关键步骤。" : "只出题目，不要给出任何答案或提示。";

      if (currentMode === "exam") {
        var ansExam = withAnswer ? "请在试卷末尾单独附一份【参考答案与评分标准】。" : "只出试卷题目，不要给出任何答案或解析。";
        return ["请按照【模式C 出卷模式】出一张试卷。", "", "【出卷范围】", input, "", "【要求】", gradeStr, diffStr, ansExam].filter(Boolean).join("\n");
      }
      if (currentMode === "mimic") {
        return ["请按照【模式A 仿例题模式】出题。", "", "【例题】", input, "", "【要求】", gradeStr, "同类型题、举一反三题、关联知识点题各出 " + count + " 道。", "整体难度以例题为准，举一反三题比例题略难一档。", ansStr].filter(Boolean).join("\n");
      }
      // knowledge
      return ["请按照【模式B 知识点出题模式】出题。", "", "【知识点】", input, "", "【要求】", gradeStr, diffStr, "共出 " + count + " 道题，覆盖该知识点的常见题型，从易到难排列。", ansStr].filter(Boolean).join("\n");
    }

    // ---------- 工具函数 ----------
    function setStatus(msg, isError) {
      var el = $("status");
      el.textContent = msg;
      el.className = "status" + (isError ? " error" : "");
    }
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ---------- 渲染输出 ----------
    function renderOutput(md) {
      var out = $("outBody");
      var html;
      try { html = marked.parse(md); }
      catch (e) { html = "<pre>" + escapeHtml(md) + "</pre>"; }
      out.innerHTML = html;
      if (window.renderMathInElement) {
        try {
          renderMathInElement(out, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false,
            strict: false
          });
        } catch (e) {}
      }
      renderGraphs(out);
      $("output").classList.add("show");
    }

    // ---------- 调用 API ----------
    async function generate() {
      var input = $("input").value.trim();
      if (!input) { setStatus("请先在上方输入例题 / 知识点 / 要求。", true); return; }
      if (!API_KEY && !cfg.proxyUrl) { openKeyModal("请先输入 API 密钥再出题。"); return; }

      var slow = isReasoningModel(currentModel);
      setStatus(slow ? "正在出题…推理模型较慢，可能需要 1~3 分钟，请耐心等待" : "正在出题，请稍候（一般十几秒）…", false);
      $("generate").disabled = true;
      var timer = null;

      try {
        var headers = { "Content-Type": "application/json" };
        if (API_KEY) { headers["Authorization"] = "Bearer " + API_KEY; }
        var controller = new AbortController();
        timer = setTimeout(function () { controller.abort(); }, slow ? 240000 : 120000);
        var resp = await fetch(API_URL, {
          method: "POST",
          headers: headers,
          signal: controller.signal,
          body: JSON.stringify({
            model: currentModel,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: buildUserMessage() }
            ],
            temperature: TEMPERATURE,
            max_tokens: MAX_TOKENS,
            stream: false
          })
        });

        if (!resp.ok) {
          var errText = "";
          try { errText = await resp.text(); } catch (e) {}
          throw new Error("接口返回 " + resp.status + "：" + errText.slice(0, 300));
        }

        var data = await resp.json();
        var msg = (data.choices && data.choices[0] && data.choices[0].message) || {};
        var content = msg.content || "";
        if (!content) {
          if (msg.reasoning_content) {
            setStatus("模型只返回了思考过程、没有正式答案（可能题目太多或长度不够）。请减少题目数量，或切成「快」模型。", true);
          } else {
            setStatus("没有收到内容，接口返回异常。", true);
          }
          return;
        }

        renderOutput(content);
        setStatus("出题完成 ✓", false);
      } catch (e) {
        if (e && e.name === "AbortError") {
          setStatus("请求超时。推理模型出题慢：请减少题目数量，或切成「快」模型。", true);
        } else {
          setStatus("出题失败：" + e.message + "（若提示网络或 CORS 错误，见 README 的“常见问题”）", true);
        }
      } finally {
        if (timer) { clearTimeout(timer); }
        $("generate").disabled = false;
      }
    }

    // ---------- 交互 ----------
    function switchMode(mode) {
      currentMode = mode;
      var tabs = document.querySelectorAll("#tabs .tab");
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mode") === mode);
      }
      $("hint").textContent = HINTS[mode];
      $("input").placeholder = PLACEHOLDERS[mode];
    }

    var tabs = document.querySelectorAll("#tabs .tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function () {
        switchMode(this.getAttribute("data-mode"));
      });
    }

    $("generate").addEventListener("click", generate);

    $("copy").addEventListener("click", function () {
      var text = $("outBody").innerText || "";
      if (!text) { setStatus("还没有可复制的题目。", true); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          setStatus("已复制到剪贴板 ✓", false);
        }, function () {
          setStatus("复制失败，请手动长按选择复制。", true);
        });
      } else {
        setStatus("当前环境不支持一键复制，请手动长按选择复制。", true);
      }
    });

    // ---------- 函数图像渲染 ----------
    function renderGraphs(root) {
      var blocks = root.querySelectorAll("pre code.language-graph");
      for (var i = 0; i < blocks.length; i++) {
        var code = blocks[i];
        var pre = code.parentNode;
        var wrap = document.createElement("div");
        wrap.className = "graph-wrap";
        drawPlot(wrap, code.textContent || "");
        pre.parentNode.replaceChild(wrap, pre);
      }
    }

    function drawPlot(wrap, text) {
      var lines = text.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      var exprs = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var eq = line.indexOf("=");
        var expr = (eq >= 0) ? line.slice(eq + 1).trim() : line;
        if (expr) exprs.push(expr);
      }
      if (!exprs.length) { wrap.textContent = "（图表内容为空）"; return; }

      var canvas = document.createElement("canvas");
      canvas.width = 620; canvas.height = 420;
      wrap.appendChild(canvas);

      var compiled = [];
      for (var i = 0; i < exprs.length; i++) {
        try { compiled.push({ expr: exprs[i], fn: math.compile(exprs[i]) }); }
        catch (e) {}
      }
      if (!compiled.length) {
        wrap.appendChild(document.createTextNode("（图表函数无法解析：" + exprs.join("，") + "）"));
        return;
      }

      var xmin = -10, xmax = 10;
      var step = (xmax - xmin) / 600;
      var ymin = Infinity, ymax = -Infinity;
      for (var i = 0; i < compiled.length; i++) {
        for (var x = xmin; x <= xmax; x += step) {
          try {
            var y = evalAt(compiled[i].fn, x);
            if (typeof y === "number" && isFinite(y)) { if (y < ymin) ymin = y; if (y > ymax) ymax = y; }
          } catch (e) {}
        }
      }
      if (!isFinite(ymin)) { ymin = -10; ymax = 10; }
      var pad = (ymax - ymin) * 0.12 || 1;
      ymin -= pad; ymax += pad;

      var ctx = canvas.getContext("2d");
      var W = canvas.width, H = canvas.height;
      var mx = 48, my = 20, plotW = W - mx - 16, plotH = H - my - 32;

      function sx(x) { return mx + (x - xmin) / (xmax - xmin) * plotW; }
      function sy(y) { return my + (ymax - y) / (ymax - ymin) * plotH; }

      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);

      var xStep = niceStep(xmax - xmin, 10);
      var yStep = niceStep(ymax - ymin, 8);
      ctx.strokeStyle = "#e8ecf3"; ctx.lineWidth = 1;
      for (var gx = Math.ceil(xmin / xStep) * xStep; gx <= xmax; gx += xStep) {
        ctx.beginPath(); ctx.moveTo(sx(gx), my); ctx.lineTo(sx(gx), my + plotH); ctx.stroke();
      }
      for (var gy = Math.ceil(ymin / yStep) * yStep; gy <= ymax; gy += yStep) {
        ctx.beginPath(); ctx.moveTo(mx, sy(gy)); ctx.lineTo(mx + plotW, sy(gy)); ctx.stroke();
      }

      ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.4;
      if (0 >= ymin && 0 <= ymax) { ctx.beginPath(); ctx.moveTo(mx, sy(0)); ctx.lineTo(mx + plotW, sy(0)); ctx.stroke(); }
      if (0 >= xmin && 0 <= xmax) { ctx.beginPath(); ctx.moveTo(sx(0), my); ctx.lineTo(sx(0), my + plotH); ctx.stroke(); }

      ctx.fillStyle = "#6b7280"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
      for (var gx2 = Math.ceil(xmin / xStep) * xStep; gx2 <= xmax; gx2 += xStep) {
        if (Math.abs(gx2) < 1e-9) continue;
        ctx.fillText(fmt(gx2), sx(gx2), my + plotH + 15);
      }
      ctx.textAlign = "right";
      for (var gy2 = Math.ceil(ymin / yStep) * yStep; gy2 <= ymax; gy2 += yStep) {
        if (Math.abs(gy2) < 1e-9) continue;
        ctx.fillText(fmt(gy2), mx - 6, sy(gy2) + 4);
      }
      ctx.textAlign = "right"; ctx.fillText("O", mx - 6, sy(0) + 14);

      var colors = ["#2f6fed", "#e11d48", "#059669", "#d97706", "#7c3aed", "#0891b2"];
      for (var i = 0; i < compiled.length; i++) {
        ctx.strokeStyle = colors[i % colors.length]; ctx.lineWidth = 2;
        ctx.beginPath();
        var started = false;
        for (var x = xmin; x <= xmax; x += step) {
          try {
            var yv = evalAt(compiled[i].fn, x);
            if (typeof yv !== "number" || !isFinite(yv) || yv < ymin || yv > ymax) { started = false; continue; }
            var px = sx(x), py = sy(yv);
            if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
          } catch (e) { started = false; }
        }
        ctx.stroke();
      }

      ctx.font = "12px sans-serif"; ctx.textAlign = "left";
      var ly = my + 16;
      for (var i = 0; i < compiled.length; i++) {
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillRect(mx + 8, ly - 9, 14, 3);
        ctx.fillStyle = "#1f2937";
        ctx.fillText("y = " + compiled[i].expr, mx + 26, ly);
        ly += 16;
      }
    }

    function evalAt(f, x) {
      var scope = { x: x };
      try {
        if (typeof f === "function") { return f(scope); }
        return f.evaluate(scope);
      } catch (e) { return NaN; }
    }
    function niceStep(range, target) {
      var raw = range / target;
      var mag = Math.pow(10, Math.floor(Math.log10(raw)));
      var norm = raw / mag;
      var step;
      if (norm < 1.5) step = 1; else if (norm < 3.5) step = 2; else if (norm < 7.5) step = 5; else step = 10;
      return step * mag;
    }
    function fmt(n) {
      return String(Math.round(n * 1000) / 1000);
    }

    // ---------- 导出图片 / PDF ----------
    function exportImage() {
      var out = $("outBody");
      if (!out || !out.textContent.trim()) { setStatus("还没有可导出的题目。", true); return; }
      setStatus("正在生成图片…", false);
      if (!window.html2canvas) { setStatus("图片组件未加载（网络问题），请刷新重试。", true); return; }
      html2canvas(out, { backgroundColor: "#ffffff", scale: 2 }).then(function (canvas) {
        var url = canvas.toDataURL("image/png");
        $("imgPreview").src = url;
        $("imgDownload").href = url;
        $("imgModal").classList.add("show");
        setStatus("图片已生成，长按图片即可保存到相册 ✓", false);
      }).catch(function (e) {
        setStatus("导出图片失败：" + (e && e.message ? e.message : e), true);
      });
    }

    function openNameModal() {
      if (!$("outBody").textContent.trim()) { setStatus("还没有可导出的题目。", true); return; }
      $("pdfName").value = "出题";
      $("nameModal").classList.add("show");
      setTimeout(function () { $("pdfName").focus(); $("pdfName").select(); }, 50);
    }
    function closeNameModal() { $("nameModal").classList.remove("show"); }

    async function doExportPdf(name) {
      var out = $("outBody");
      if (!window.html2canvas) { setStatus("图片组件未加载（网络问题），请刷新重试。", true); return; }
      if (!window.jspdf || !window.jspdf.jsPDF) { setStatus("PDF 组件未加载（网络问题），请刷新重试。", true); return; }

      setStatus("正在生成 PDF…", false);
      var btn = $("exportPdf");
      btn.disabled = true;

      // 用固定桌面宽度 800px 的副本渲染，避免手机上按窄屏渲染成又窄又长的 PDF
      var holder = document.createElement("div");
      holder.style.cssText = "position:absolute;left:-9999px;top:0;width:800px;background:#fff;";
      var clone = out.cloneNode(true);
      clone.style.border = "none";
      clone.style.background = "#fff";
      clone.style.padding = "0";
      holder.appendChild(clone);
      document.body.appendChild(holder);

      // 克隆的 canvas 是空白的，把原图内容复制过去
      var origCanvases = out.querySelectorAll("canvas");
      var cloneCanvases = clone.querySelectorAll("canvas");
      for (var c = 0; c < cloneCanvases.length; c++) {
        if (origCanvases[c]) {
          try { cloneCanvases[c].getContext("2d").drawImage(origCanvases[c], 0, 0); } catch (e) {}
        }
      }

      try {
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        var pageW = 210, pageH = 297, margin = 12;
        var contentW = pageW - margin * 2;   // 186mm
        var contentH = pageH - margin * 2;   // 273mm
        var y = margin;

        // 按「段落/公式/图」逐块渲染并分页，避免把一行字切到两页
        var blocks = clone.querySelectorAll("h1, h2, h3, h4, p, ul, ol, .graph-wrap, pre, blockquote");
        for (var i = 0; i < blocks.length; i++) {
          var el = blocks[i];
          if (!el || !el.textContent || !el.textContent.trim()) continue;
          var canvas = await html2canvas(el, { backgroundColor: "#ffffff", scale: 2 });
          var imgHmm = canvas.height * (contentW / canvas.width);
          if (y + imgHmm > pageH - margin && y > margin) {
            pdf.addPage();
            y = margin;
          }
          if (imgHmm > contentH) { imgHmm = contentH; }
          pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", margin, y, contentW, imgHmm);
          y += imgHmm + 1.5;
        }

        pdf.save((name || "出题") + ".pdf");
        setStatus("PDF 已生成并开始下载 ✓", false);
      } catch (e) {
        setStatus("生成 PDF 失败：" + (e && e.message ? e.message : e), true);
      } finally {
        document.body.removeChild(holder);
        btn.disabled = false;
      }
    }

    $("exportImg").addEventListener("click", exportImage);
    $("exportPdf").addEventListener("click", openNameModal);
    $("nameOk").addEventListener("click", function () {
      var name = ($("pdfName").value || "").trim() || "出题";
      closeNameModal();
      doExportPdf(name);
    });
    $("nameCancel").addEventListener("click", closeNameModal);
    $("nameModal").addEventListener("click", function (e) { if (e.target === $("nameModal")) { closeNameModal(); } });
    $("pdfName").addEventListener("keydown", function (e) { if (e.key === "Enter") {
      var name = ($("pdfName").value || "").trim() || "出题";
      closeNameModal();
      doExportPdf(name);
    } });
    $("closeModal").addEventListener("click", function () { $("imgModal").classList.remove("show"); });
    $("imgModal").addEventListener("click", function (e) { if (e.target === $("imgModal")) { $("imgModal").classList.remove("show"); } });

    // ---------- 密钥管理（存本机浏览器，不上传仓库） ----------
    function openKeyModal(msg) {
      $("keyInput").value = API_KEY || "";
      $("keyErr").textContent = msg || "";
      $("keyModal").classList.add("show");
      setTimeout(function () { $("keyInput").focus(); }, 50);
    }
    function closeKeyModal() {
      $("keyModal").classList.remove("show");
      $("keyErr").textContent = "";
    }
    function saveKey() {
      var v = ($("keyInput").value || "").trim();
      if (!v) { $("keyErr").textContent = "密钥不能为空。"; return; }
      API_KEY = v;
      try { localStorage.setItem(LS_KEY, v); } catch (e) {}
      closeKeyModal();
      setStatus("密钥已保存到本机浏览器 ✓（仅本设备有效）", false);
    }
    $("keyBtn").addEventListener("click", function () { openKeyModal(); });
    $("keySave").addEventListener("click", saveKey);
    $("keyCancel").addEventListener("click", closeKeyModal);
    $("keyModal").addEventListener("click", function (e) { if (e.target === $("keyModal")) { closeKeyModal(); } });
    $("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { saveKey(); } });

    // 快/慢模型切换
    var segBtns = document.querySelectorAll("#modelSeg .seg-btn");
    for (var i = 0; i < segBtns.length; i++) {
      segBtns[i].addEventListener("click", function () {
        currentModel = (this.getAttribute("data-model") === "slow") ? MODEL_SLOW : MODEL_FAST;
        for (var j = 0; j < segBtns.length; j++) {
          segBtns[j].classList.toggle("active", segBtns[j] === this);
        }
      });
    }

    // 初始化
    switchMode("exam");
    if (!API_KEY && !cfg.proxyUrl) { openKeyModal("首次使用请粘贴你的硅基流动密钥（只保存在本机浏览器）。"); }
  })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
