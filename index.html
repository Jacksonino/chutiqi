<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>小许同学专用</title>

  <!-- PWA：可添加到主屏幕 / 打包成 App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="出题器" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />

  <!-- KaTeX 数学公式渲染 + Markdown 排版（从公共 CDN 加载） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- 导出图片 + 函数图像绘制 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12/lib/browser/math.js"></script>

  <style>
    :root {
      --brand: #2f6fed;
      --brand-dark: #1f57c4;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.6; padding-bottom: 40px;
    }
    header {
      background: linear-gradient(135deg, #2f6fed, #5a8bff);
      color: #fff; padding: 18px 16px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
    .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .key-btn { flex-shrink: 0; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }

    main { max-width: 640px; margin: 0 auto; padding: 14px; }

    .card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    /* 模式切换 */
    .tabs { display: flex; gap: 8px; }
    .tab {
      flex: 1; text-align: center; padding: 11px 4px;
      background: #eef2fb; color: #475569; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1.5px solid transparent; user-select: none;
    }
    .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .hint { margin-top: 12px; font-size: 13px; color: var(--muted); background: #f8fafc; border-radius: 10px; padding: 10px 12px; }

    /* 输入 */
    textarea {
      width: 100%; min-height: 130px; resize: vertical;
      border: 1.5px solid var(--line); border-radius: 12px;
      padding: 12px; font-size: 15px; font-family: inherit; color: var(--text);
      outline: none; background: #fff;
    }
    textarea:focus { border-color: var(--brand); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .field { flex: 1; min-width: 100px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    select, input[type=number] {
      width: 100%; padding: 9px 8px; font-size: 15px;
      border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
      outline: none;
    }
    .seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg-btn { flex: 1; padding: 9px 0; font-size: 15px; border: none; background: #fff; color: #475569; cursor: pointer; }
    .seg-btn.active { background: var(--brand); color: #fff; }
    .check { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 12px; color: var(--text); }
    .check input { width: 18px; height: 18px; }

    /* 拍照识别题目 */
    .photo-row { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .photo-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; font-size: 15px; font-weight: 600;
      color: var(--brand); background: #eef4ff;
      border: 1.5px dashed var(--brand); border-radius: 10px; cursor: pointer;
    }
    .photo-btn:active { background: #dfe9ff; }
    .photo-status { font-size: 13px; color: var(--muted); }
    .photo-preview { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
    .photo-preview img { height: 64px; max-width: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .photo-clear { border: none; background: #eef2fb; color: #475569; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }

    /* 按钮 */
    button.primary {
      width: 100%; padding: 14px; margin-top: 12px;
      background: var(--brand); color: #fff; border: none; border-radius: 12px;
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    button.primary:active { background: var(--brand-dark); }
    button.primary:disabled { background: #9db8f5; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 20px; }
    .status.error { color: #dc2626; }

    /* 输出 */
    .output { display: none; }
    .output.show { display: block; }
    .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .out-head .ttl { font-size: 14px; font-weight: 700; color: #475569; }
    .mini-btn {
      border: 1px solid var(--line); background: #fff; color: #475569;
      border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .out-body {
      background: #fbfcfe; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; font-size: 15px; overflow-wrap: break-word;
    }
    .out-body h2 { font-size: 16px; color: var(--brand-dark); margin: 16px 0 8px; }
    .out-body h3 { font-size: 15px; margin: 14px 0 6px; }
    .out-body p { margin: 8px 0; }
    .out-body .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .out-body ul, .out-body ol { padding-left: 22px; }
    .out-head > div { display: flex; gap: 6px; flex-wrap: wrap; }

    /* 函数图像 */
    .graph-wrap { margin: 10px 0; text-align: center; }
    .graph-wrap canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

    /* 图片导出弹层 */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; border-radius: 14px; padding: 16px; max-width: 94vw; max-height: 94vh; overflow: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 700; color: #475569; }
    .modal-box img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

    /* 加载动画遮罩 */
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,.55); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
    .loading-overlay.show { display: flex; }
    .loading-overlay canvas { width: min(300px, 80vw); height: auto; }
    .loading-text { color: #fff; font-size: 15px; font-weight: 600; }
    .tap-hint { color: rgba(255,255,255,.85); font-size: 12px; }

    /* 打印/存PDF：只保留出题结果 */
    @media print {
      header, .card:not(.output), footer, .out-head .mini-btn, .modal { display: none !important; }
      body { background: #fff; padding: 0; }
      main { max-width: none; padding: 0; }
      .output { display: block !important; }
      .out-body { border: none; background: #fff; padding: 0; }
    }

    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <div>
        <h1>小许同学专用</h1>
        <p>出卷 · 仿例题 · 按知识点，都能出题</p>
      </div>
      <button class="key-btn" id="keyBtn">🔑 密钥</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="tabs" id="tabs">
        <div class="tab active" data-mode="exam">📝 出卷</div>
        <div class="tab" data-mode="mimic">📋 仿例题</div>
        <div class="tab" data-mode="knowledge">📚 按知识点</div>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="card">
      <textarea id="input" placeholder="在这里输入内容…"></textarea>

      <div class="photo-row" id="photoRow" style="display:none;">
        <button type="button" class="photo-btn" id="photoBtn">📷 拍照识别</button>
        <button type="button" class="photo-btn" id="galleryBtn">🖼 相册选图</button>
        <span class="photo-status" id="photoStatus"></span>
        <span class="photo-preview" id="photoPreview" style="display:none;">
          <img id="photoImg" alt="题目照片" />
          <button type="button" class="photo-clear" id="photoClear">✕</button>
        </span>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />
        <input type="file" id="galleryInput" accept="image/*" style="display:none;" />
      </div>

      <div class="controls">
        <div class="field">
          <label>年级 / 学段</label>
          <select id="grade">
            <option value="不限" selected>不限</option>
            <option value="小学">小学</option>
            <option value="初一">初一</option>
            <option value="初二">初二</option>
            <option value="初三">初三</option>
            <option value="高一">高一</option>
            <option value="高二">高二</option>
            <option value="高三">高三</option>
            <option value="大学/考研">大学/考研</option>
          </select>
        </div>
        <div class="field">
          <label>题目数量</label>
          <input type="number" id="count" value="5" min="1" max="20" />
        </div>
        <div class="field">
          <label>难度</label>
          <select id="difficulty">
            <option value="不限">不限</option>
            <option value="基础">基础</option>
            <option value="中等" selected>中等</option>
            <option value="较难">较难</option>
            <option value="压轴">压轴</option>
          </select>
        </div>
        <div class="field">
          <label>模型速度</label>
          <div class="seg" id="modelSeg">
            <button type="button" class="seg-btn active" data-model="fast" title="deepseek-ai/DeepSeek-V3（快）">快</button>
            <button type="button" class="seg-btn" data-model="slow" title="deepseek-ai/DeepSeek-R1（慢，推理模型）">慢</button>
          </div>
        </div>
      </div>

      <div class="check">
        <input type="checkbox" id="answer" checked />
        <label for="answer">同时给出【答案与解析】（老师自己核对用，学生看不到）</label>
      </div>

      <button class="primary" id="generate">开始出题</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card output" id="output">
      <div class="out-head">
        <span class="ttl">📄 出题结果</span>
        <div>
          <button class="mini-btn" id="copy">复制</button>
          <button class="mini-btn" id="exportImg">导出图片</button>
          <button class="mini-btn" id="exportPdf">存为PDF</button>
        </div>
      </div>
      <div class="out-body" id="outBody"></div>
    </div>

    <!-- 导出图片预览弹层 -->
    <div class="modal" id="imgModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>长按图片保存到相册</span>
          <button class="mini-btn" id="closeModal">关闭</button>
        </div>
        <img id="imgPreview" alt="出题图片" />
        <a id="imgDownload" download="出题.png" class="mini-btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none;">点此下载图片</a>
      </div>
    </div>

    <!-- 密钥输入弹层（存在本机浏览器，不上传仓库） -->
    <div class="modal" id="keyModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>🔑 输入 API 密钥</span>
          <button class="mini-btn" id="keyCancel">取消</button>
        </div>
        <p style="font-size:13px;color:#6b7280;margin:0 0 10px;">密钥只保存在<strong>本机浏览器</strong>里，不会出现在仓库或网页源码中。可在 cloud.siliconflow.cn 后台获取。<br />同一个密钥可以私下发给同学，让同学也在自己手机上粘一次。</p>
        <input type="text" id="keyInput" placeholder="粘贴 sk- 开头的密钥" style="width:100%;padding:11px;font-size:15px;border:1.5px solid #e5e7eb;border-radius:10px;outline:none;" />
        <div id="keyErr" style="color:#dc2626;font-size:13px;margin-top:8px;min-height:16px;"></div>
        <button class="primary" id="keySave" style="margin-top:10px;">保存密钥</button>
        <button type="button" class="mini-btn" id="keyClear" style="margin-top:10px;width:100%;">🗑 清除本机已保存的密钥</button>
      </div>
    </div>

    <!-- PDF 命名弹层 -->
    <div class="modal" id="nameModal">
      <div class="modal-box">
        <div class="modal-head">
          <span>📄 给 PDF 起个名字</span>
          <button class="mini-btn" id="nameCancel">取消</button>
        </div>
        <input type="text" id="pdfName" value="出题" style="width:100%;padding:11px;font-size:15px;border:1.5px solid #e5e7eb;border-radius:10px;outline:none;" />
        <button class="primary" id="nameOk" style="margin-top:10px;">生成 PDF</button>
      </div>
    </div>

    <!-- 加载动画遮罩 -->
    <div class="loading-overlay" id="loading">
      <canvas id="catCanvas" width="320" height="150"></canvas>
      <div class="loading-text" id="loadingText">处理中…</div>
      <div class="tap-hint">👆 点一下，帮小猫抓住老鼠</div>
    </div>

    <footer>内部教学工具 · 题目由 AI 生成，建议老师过目后再使用</footer>
  </main>

  <script src="config.js"></script>
  <script>
  (function () {
    // ---------- 读取配置 ----------
    var cfg = (window.APP_CONFIG || {});
    var LS_KEY = "chutiqi_api_key";
    var API_KEY = readStoredKey() || (cfg.apiKey || "");
    var BASE_URL = cfg.baseUrl || "https://api.siliconflow.cn/v1/chat/completions";
    // 有 proxyUrl 就走服务端代理（部署版：密钥在服务端，且无跨域问题）；
    // 否则本地用 apiKey 直连硅基流动；两者都没有则回退到同源 /api/chat。
    var API_URL = cfg.proxyUrl || (API_KEY ? BASE_URL : "/api/chat");
    var MODEL_FAST = cfg.modelFast || "deepseek-ai/DeepSeek-V3";
    var MODEL_SLOW = cfg.modelSlow || "deepseek-ai/DeepSeek-R1";
    var currentModel = MODEL_FAST;
    var MODEL_VISION = cfg.modelVision || "Qwen/Qwen3-VL-8B-Instruct";
    var TEMPERATURE = (typeof cfg.temperature === "number") ? cfg.temperature : 0.6;
    var MAX_TOKENS = cfg.maxTokens || 4096;

    function isReasoningModel(m) {
      var s = (m || "").toLowerCase();
      return s.indexOf("r1") !== -1 || s.indexOf("reasoner") !== -1 || s.indexOf("reasoning") !== -1 || s.indexOf("qwq") !== -1;
    }

    function $(id) { return document.getElementById(id); }

    function storeStoredKey(v) {
      try { localStorage.setItem(LS_KEY, v); } catch (e) {}
      try { document.cookie = LS_KEY + "=" + encodeURIComponent(v) + "; max-age=31536000; path=/; SameSite=Lax"; } catch (e) {}
    }
    function readStoredKey() {
      try { var ls = localStorage.getItem(LS_KEY); if (ls) return ls; } catch (e) {}
      try {
        var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + LS_KEY + "=([^;]*)"));
        if (m) return decodeURIComponent(m[1]);
      } catch (e) {}
      return "";
    }

    // ---------- 加载动画：小猫抓老鼠 ----------
    var loadingInterval = null;
    var catAnimId = null;

    function startCatAnim() {
      var cv = $("catCanvas");
      if (!cv || !cv.getContext) return;
      stopCatAnim();
      var dpr = window.devicePixelRatio || 1;
      var W = 320, H = 150;
      cv.width = W * dpr; cv.height = H * dpr;
      var ctx = cv.getContext("2d");
      ctx.scale(dpr, dpr);

      var mouse = { x: W * 0.72, y: H * 0.5, vx: 2.1, vy: 1.5 };
      var cat = { x: W * 0.22, y: H * 0.5 };
      var caught = 0, CAT_SPEED = 1.75;

      function frame() {
        if (caught > 0) {
          caught--;
          if (caught === 0) {
            mouse.x = 30 + Math.random() * (W - 60);
            mouse.y = 30 + Math.random() * (H - 60);
            mouse.vx = (Math.random() < 0.5 ? -1 : 1) * (1.6 + Math.random());
            mouse.vy = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random());
          }
        } else {
          mouse.x += mouse.vx; mouse.y += mouse.vy;
          if (mouse.x < 22 || mouse.x > W - 22) mouse.vx *= -1;
          if (mouse.y < 24 || mouse.y > H - 24) mouse.vy *= -1;
          var dx = mouse.x - cat.x, dy = mouse.y - cat.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > 1) { cat.x += dx / d * CAT_SPEED; cat.y += dy / d * CAT_SPEED; }
          if (d < 22) { caught = 42; }
        }

        ctx.clearRect(0, 0, W, H);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (caught > 0) {
          ctx.font = "38px serif";
          ctx.fillText("😸", cat.x, cat.y);
          ctx.font = "20px serif";
          ctx.fillText("💥", (mouse.x + cat.x) / 2, (mouse.y + cat.y) / 2 - 16);
        } else {
          ctx.font = "38px serif";
          ctx.fillText("🐱", cat.x, cat.y);
          ctx.font = "28px serif";
          ctx.fillText("🐭", mouse.x, mouse.y);
        }
        catAnimId = requestAnimationFrame(frame);
      }
      cv.onclick = function () { if (caught === 0) { caught = 42; } };
      frame();
    }
    function stopCatAnim() {
      if (catAnimId) { cancelAnimationFrame(catAnimId); catAnimId = null; }
    }

    function showLoading(text) {
      $("loadingText").textContent = text || "处理中…";
      $("loading").classList.add("show");
      startCatAnim();
    }
    function startLoadingTips(slow) {
      var tips = slow
        ? ["正在读题…（推理模型较慢，请耐心等待）", "正在组织知识点…", "正在深度思考…", "正在验算答案…", "马上就好…"]
        : ["正在读题…", "正在组织知识点…", "正在验算答案…", "正在排版公式…", "正在画图…", "马上就好…"];
      var i = 0;
      $("loading").classList.add("show");
      $("loadingText").textContent = tips[0];
      startCatAnim();
      if (loadingInterval) clearInterval(loadingInterval);
      loadingInterval = setInterval(function () {
        i = (i + 1) % tips.length;
        $("loadingText").textContent = tips[i];
      }, 2600);
    }
    function hideLoading() {
      $("loading").classList.remove("show");
      stopCatAnim();
      if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
    }

    // ---------- 三种模式 ----------
    var currentMode = "exam";
    var HINTS = {
      exam: "输入出卷范围，例如：初一上册第二~三单元、九年级期中、高一第一学期期末……我会按该范围的教材目录自动组织知识点，出一张完整试卷（选择+填空+解答，含分值）。",
      mimic: "粘贴一道例题（可含题目和答案）。我会先分析它的知识点和题型，再给你出：①同类型题 ②举一反三题 ③关联知识点题。",
      knowledge: "输入一个知识点，例如：一元一次方程、二次函数、勾股定理、因式分解、三角函数……再在上面选好年级，我会按该知识点的常见题型出题。"
    };
    var PLACEHOLDERS = {
      exam: "示例：\n出一张初一上册第二~三单元的单元测试卷",
      mimic: "示例：\n解方程 2x + 3 = 11，求 x 的值。",
      knowledge: "示例：\n一元一次方程"
    };

    // ---------- 系统提示词（核心） ----------
    var SYSTEM_PROMPT = [

    // ---------- 组装用户消息 ----------
    function buildUserMessage() {
      var input = $("input").value.trim();
      var grade = $("grade").value;
      var count = ($("count").value || 5);
      var difficulty = $("difficulty").value;
      var withAnswer = $("answer").checked;

      var gradeStr = (grade && grade !== "不限") ? "年级/学段：" + grade : "";
      var diffStr = "";
      if (difficulty === "压轴") { diffStr = "难度：压轴（硬性要求，必须达到中考/高考压轴题难度，宁难勿易，偏难不算错）"; }
      else if (difficulty === "较难") { diffStr = "难度：较难（硬性要求，必须多步推理、含参数或分类讨论，明显难于中等题）"; }
      else if (difficulty && difficulty !== "不限") { diffStr = "难度：" + difficulty; }
      var ansStr = withAnswer ? "请为每道题附上【答案与解析】，解析写出关键步骤。" : "只出题目，不要给出任何答案或提示。";

      if (currentMode === "exam") {
        var ansExam = withAnswer ? "请在试卷末尾单独附一份【参考答案与评分标准】。" : "只出试卷题目，不要给出任何答案或解析。";
        return ["请按照【模式C 出卷模式】出一张试卷。", "", "【出卷范围】", input, "", "【要求】", gradeStr, diffStr, ansExam].filter(Boolean).join("\n");
      }
      if (currentMode === "mimic") {
        return ["请按照【模式A 仿例题模式】出题。", "", "【例题】", input, "", "【要求】", gradeStr, "同类型题、举一反三题、关联知识点题各出 " + count + " 道。", "整体难度以例题为准，举一反三题比例题略难一档。", ansStr].filter(Boolean).join("\n");
      }
      // knowledge
      return ["请按照【模式B 知识点出题模式】出题。", "", "【知识点】", input, "", "【要求】", gradeStr, diffStr, "共出 " + count + " 道题，覆盖该知识点的常见题型，从易到难排列。", ansStr].filter(Boolean).join("\n");
    }

    // ---------- 工具函数 ----------
    function setStatus(msg, isError) {
      var el = $("status");
      el.textContent = msg;
      el.className = "status" + (isError ? " error" : "");
    }
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ---------- 渲染输出 ----------
    // 清理模型在公式外误写的 LaTeX 间距命令（\quad、\qquad 等），避免显示成乱码
    function cleanLatexSpacing(md) {
      if (!md) return md;
      // 1) 反斜杠被写成斜杠的（/quad 等）——永远非法，换成空格
      md = md.replace(/\/\s*\\?\s*(quad|qquad|enspace|;|,|!)/g, " ");
      // 2) 用占位符保护 $...$ 与 $$...$$ 里的内容，避免误删公式内的间距
      var stash = [];
      md = md.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+\$/g, function (m) {
        stash.push(m);
        return "\u0001" + (stash.length - 1) + "\u0002";
      });
      // 3) 数学段之外，把 \quad、\qquad、\;、\,、\!、\enspace 换成空格
      md = md.replace(/\\quad\b/g, " ")
             .replace(/\\qquad\b/g, " ")
             .replace(/\\enspace\b/g, " ")
             .replace(/\\;/g, " ")
             .replace(/\\,/g, " ")
             .replace(/\\!/g, " ");
      // 4) 还原数学段
      for (var i = 0; i < stash.length; i++) {
        md = md.split("\u0001" + i + "\u0002").join(stash[i]);
      }
      return md;
    }

    function renderOutput(md) {
      var out = $("outBody");
      md = cleanLatexSpacing(md);
      var html;
      try { html = marked.parse(md); }
      catch (e) { html = "<pre>" + escapeHtml(md) + "</pre>"; }
      out.innerHTML = html;
      if (window.renderMathInElement) {
        try {
          renderMathInElement(out, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false,
            strict: false
          });
        } catch (e) {}
      }
      renderGraphs(out);
      $("output").classList.add("show");
    }

    // ---------- 调用 API ----------
    async function generate() {
      var input = $("input").value.trim();
      if (!input) {
        if (currentMode === "mimic") {
          setStatus("请先在上方输入例题，或用下方的「📷 拍照识别 / 🖼 相册选图」拍照填入题目。", true);
        } else {
          setStatus("请先在上方输入例题 / 知识点 / 要求。", true);
        }
        return;
      }
      if (!API_KEY && !cfg.proxyUrl) { openKeyModal("请先输入 API 密钥再出题。"); return; }

      var slow = isReasoningModel(currentModel);
      startLoadingTips(slow);
      $("generate").disabled = true;
      var timer = null;

      try {
        var headers = { "Content-Type": "application/json" };
        if (API_KEY) { headers["Authorization"] = "Bearer " + API_KEY; }
        var controller = new AbortController();
        timer = setTimeout(function () { controller.abort(); }, slow ? 240000 : 120000);
        var resp = await fetch(API_URL, {
          method: "POST",
          headers: headers,
          signal: controller.signal,
          body: JSON.stringify({
            model: currentModel,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: buildUserMessage() }
            ],
            temperature: TEMPERATURE,
            max_tokens: MAX_TOKENS,
            stream: false
          })
        });

        if (!resp.ok) {
          var errText = "";
          try { errText = await resp.text(); } catch (e) {}
          throw new Error("接口返回 " + resp.status + "：" + errText.slice(0, 300));
        }

        var data = await resp.json();
        var msg = (data.choices && data.choices[0] && data.choices[0].message) || {};
        var content = msg.content || "";
        if (!content) {
          if (msg.reasoning_content) {
            setStatus("模型只返回了思考过程、没有正式答案（可能题目太多或长度不够）。请减少题目数量，或切成「快」模型。", true);
          } else {
            setStatus("没有收到内容，接口返回异常。", true);
          }
          return;
        }

        renderOutput(content);
        setStatus("出题完成 ✓", false);
      } catch (e) {
        if (e && e.name === "AbortError") {
          setStatus("请求超时。推理模型出题慢：请减少题目数量，或切成「快」模型。", true);
        } else {
          setStatus("出题失败：" + e.message + "（若提示网络或 CORS 错误，见 README 的“常见问题”）", true);
        }
      } finally {
        hideLoading();
        if (timer) { clearTimeout(timer); }
        $("generate").disabled = false;
      }
    }

    // ---------- 交互 ----------
    function switchMode(mode) {
      currentMode = mode;
      var tabs = document.querySelectorAll("#tabs .tab");
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mode") === mode);
      }
      $("hint").textContent = HINTS[mode];
      $("input").placeholder = PLACEHOLDERS[mode];
      $("photoRow").style.display = (mode === "mimic") ? "flex" : "none";
    }

    var tabs = document.querySelectorAll("#tabs .tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function () {
        switchMode(this.getAttribute("data-mode"));
      });
    }

    $("generate").addEventListener("click", generate);

    $("copy").addEventListener("click", function () {
      var text = $("outBody").innerText || "";
      if (!text) { setStatus("还没有可复制的题目。", true); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          setStatus("已复制到剪贴板 ✓", false);
        }, function () {
          setStatus("复制失败，请手动长按选择复制。", true);
        });
      } else {
        setStatus("当前环境不支持一键复制，请手动长按选择复制。", true);
      }
    });

    // ---------- 函数图像渲染 ----------
    function renderGraphs(root) {
      var blocks = root.querySelectorAll("pre code.language-graph");
      for (var i = 0; i < blocks.length; i++) {
        var code = blocks[i];
        var pre = code.parentNode;
        var wrap = document.createElement("div");
        wrap.className = "graph-wrap";
        drawPlot(wrap, code.textContent || "");
        pre.parentNode.replaceChild(wrap, pre);
      }
    }

    function drawPlot(wrap, text) {
      var lines = text.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      var exprs = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var eq = line.indexOf("=");
        var expr = (eq >= 0) ? line.slice(eq + 1).trim() : line;
        if (expr) exprs.push(expr);
      }
      if (!exprs.length) { wrap.textContent = "（图表内容为空）"; return; }

      var canvas = document.createElement("canvas");
      canvas.width = 620; canvas.height = 420;
      wrap.appendChild(canvas);

      var compiled = [];
      for (var i = 0; i < exprs.length; i++) {
        try { compiled.push({ expr: exprs[i], fn: math.compile(exprs[i]) }); }
        catch (e) {}
      }
      if (!compiled.length) {
        wrap.appendChild(document.createTextNode("（图表函数无法解析：" + exprs.join("，") + "）"));
        return;
      }

      var xmin = -10, xmax = 10;
      var step = (xmax - xmin) / 600;
      var ymin = Infinity, ymax = -Infinity;
      for (var i = 0; i < compiled.length; i++) {
        for (var x = xmin; x <= xmax; x += step) {
          try {
            var y = evalAt(compiled[i].fn, x);
            if (typeof y === "number" && isFinite(y)) { if (y < ymin) ymin = y; if (y > ymax) ymax = y; }
          } catch (e) {}
        }
      }
      if (!isFinite(ymin)) { ymin = -10; ymax = 10; }
      var pad = (ymax - ymin) * 0.12 || 1;
      ymin -= pad; ymax += pad;

      var ctx = canvas.getContext("2d");
      var W = canvas.width, H = canvas.height;
      var mx = 48, my = 20, plotW = W - mx - 16, plotH = H - my - 32;

      function sx(x) { return mx + (x - xmin) / (xmax - xmin) * plotW; }
      function sy(y) { return my + (ymax - y) / (ymax - ymin) * plotH; }

      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);

      var xStep = niceStep(xmax - xmin, 10);
      var yStep = niceStep(ymax - ymin, 8);
      ctx.strokeStyle = "#e8ecf3"; ctx.lineWidth = 1;
      for (var gx = Math.ceil(xmin / xStep) * xStep; gx <= xmax; gx += xStep) {
        ctx.beginPath(); ctx.moveTo(sx(gx), my); ctx.lineTo(sx(gx), my + plotH); ctx.stroke();
      }
      for (var gy = Math.ceil(ymin / yStep) * yStep; gy <= ymax; gy += yStep) {
        ctx.beginPath(); ctx.moveTo(mx, sy(gy)); ctx.lineTo(mx + plotW, sy(gy)); ctx.stroke();
      }

      ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.4;
      if (0 >= ymin && 0 <= ymax) { ctx.beginPath(); ctx.moveTo(mx, sy(0)); ctx.lineTo(mx + plotW, sy(0)); ctx.stroke(); }
      if (0 >= xmin && 0 <= xmax) { ctx.beginPath(); ctx.moveTo(sx(0), my); ctx.lineTo(sx(0), my + plotH); ctx.stroke(); }

      ctx.fillStyle = "#6b7280"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
      for (var gx2 = Math.ceil(xmin / xStep) * xStep; gx2 <= xmax; gx2 += xStep) {
        if (Math.abs(gx2) < 1e-9) continue;
        ctx.fillText(fmt(gx2), sx(gx2), my + plotH + 15);
      }
      ctx.textAlign = "right";
      for (var gy2 = Math.ceil(ymin / yStep) * yStep; gy2 <= ymax; gy2 += yStep) {
        if (Math.abs(gy2) < 1e-9) continue;
        ctx.fillText(fmt(gy2), mx - 6, sy(gy2) + 4);
      }
      ctx.textAlign = "right"; ctx.fillText("O", mx - 6, sy(0) + 14);

      var colors = ["#2f6fed", "#e11d48", "#059669", "#d97706", "#7c3aed", "#0891b2"];
      for (var i = 0; i < compiled.length; i++) {
        ctx.strokeStyle = colors[i % colors.length]; ctx.lineWidth = 2;
        ctx.beginPath();
        var started = false;
        for (var x = xmin; x <= xmax; x += step) {
          try {
            var yv = evalAt(compiled[i].fn, x);
            if (typeof yv !== "number" || !isFinite(yv) || yv < ymin || yv > ymax) { started = false; continue; }
            var px = sx(x), py = sy(yv);
            if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
          } catch (e) { started = false; }
        }
        ctx.stroke();
      }

      ctx.font = "12px sans-serif"; ctx.textAlign = "left";
      var ly = my + 16;
      for (var i = 0; i < compiled.length; i++) {
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillRect(mx + 8, ly - 9, 14, 3);
        ctx.fillStyle = "#1f2937";
        ctx.fillText("y = " + compiled[i].expr, mx + 26, ly);
        ly += 16;
      }
    }

    function evalAt(f, x) {
      var scope = { x: x };
      try {
        if (typeof f === "function") { return f(scope); }
        return f.evaluate(scope);
      } catch (e) { return NaN; }
    }
    function trimWhitespace(canvas) {
      var w = canvas.width, h = canvas.height;
      if (!w || !h) return null;
      var data;
      try { data = canvas.getContext("2d").getImageData(0, 0, w, h).data; } catch (e) { return canvas; }
      var top = -1, bottom = -1;
      for (var y = 0; y < h; y++) {
        var rs = y * w * 4;
        for (var x = 0; x < w; x++) {
          var p = rs + x * 4;
          if (data[p] < 250 || data[p + 1] < 250 || data[p + 2] < 250) { top = y; break; }
        }
        if (top !== -1) break;
      }
      if (top === -1) return null; // 整块空白
      for (var y2 = h - 1; y2 >= top; y2--) {
        var rs2 = y2 * w * 4;
        for (var x2 = 0; x2 < w; x2++) {
          var p2 = rs2 + x2 * 4;
          if (data[p2] < 250 || data[p2 + 1] < 250 || data[p2 + 2] < 250) { bottom = y2; break; }
        }
        if (bottom !== -1) break;
      }
      if (bottom < top) return null;
      var crop = document.createElement("canvas");
      crop.width = w;
      crop.height = bottom - top + 1;
      crop.getContext("2d").drawImage(canvas, 0, top, w, bottom - top + 1, 0, 0, w, bottom - top + 1);
      return crop;
    }
    function niceStep(range, target) {
      var raw = range / target;
      var mag = Math.pow(10, Math.floor(Math.log10(raw)));
      var norm = raw / mag;
      var step;
      if (norm < 1.5) step = 1; else if (norm < 3.5) step = 2; else if (norm < 7.5) step = 5; else step = 10;
      return step * mag;
    }
    function fmt(n) {
      return String(Math.round(n * 1000) / 1000);
    }

    // ---------- 导出图片 / PDF ----------
    function exportImage() {
      var out = $("outBody");
      if (!out || !out.textContent.trim()) { setStatus("还没有可导出的题目。", true); return; }
      if (!window.html2canvas) { setStatus("图片组件未加载（网络问题），请刷新重试。", true); return; }
      showLoading("正在生成图片…");
      html2canvas(out, { backgroundColor: "#ffffff", scale: 2 }).then(function (canvas) {
        hideLoading();
        var url = canvas.toDataURL("image/png");
        $("imgPreview").src = url;
        $("imgDownload").href = url;
        $("imgModal").classList.add("show");
        setStatus("图片已生成，长按图片即可保存到相册 ✓", false);
      }).catch(function (e) {
        hideLoading();
        setStatus("导出图片失败：" + (e && e.message ? e.message : e), true);
      });
    }

    function openNameModal() {
      if (!$("outBody").textContent.trim()) { setStatus("还没有可导出的题目。", true); return; }
      $("pdfName").value = "出题";
      $("nameModal").classList.add("show");
      setTimeout(function () { $("pdfName").focus(); $("pdfName").select(); }, 50);
    }
    function closeNameModal() { $("nameModal").classList.remove("show"); }

    async function doExportPdf(name) {
      var out = $("outBody");
      if (!window.html2canvas) { setStatus("图片组件未加载（网络问题），请刷新重试。", true); return; }
      if (!window.jspdf || !window.jspdf.jsPDF) { setStatus("PDF 组件未加载（网络问题），请刷新重试。", true); return; }

      showLoading("正在生成 PDF…");
      var btn = $("exportPdf");
      btn.disabled = true;

      // 用固定桌面宽度 800px 的副本渲染，避免手机上按窄屏渲染成又窄又长的 PDF
      var holder = document.createElement("div");
      holder.style.cssText = "position:absolute;left:-9999px;top:0;width:800px;background:#fff;";
      var clone = out.cloneNode(true);
      clone.style.border = "none";
      clone.style.background = "#fff";
      clone.style.padding = "0";
      holder.appendChild(clone);
      document.body.appendChild(holder);

      // 克隆的 canvas 是空白的，把原图内容复制过去
      var origCanvases = out.querySelectorAll("canvas");
      var cloneCanvases = clone.querySelectorAll("canvas");
      for (var c = 0; c < cloneCanvases.length; c++) {
        if (origCanvases[c]) {
          try { cloneCanvases[c].getContext("2d").drawImage(origCanvases[c], 0, 0); } catch (e) {}
        }
      }

      try {
        // 整页渲染成一张长图，再按「空白行」智能切页：既不切字、也不留大段空白
        var full = await html2canvas(clone, { backgroundColor: "#ffffff", scale: 1.5 });
        full = trimWhitespace(full);
        if (!full) { setStatus("内容为空，无法生成 PDF。", true); return; }

        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        var pageW = 210, pageH = 297, margin = 12;
        var contentW = pageW - margin * 2;   // 186mm
        var contentH = pageH - margin * 2;   // 273mm
        var pxPerMm = full.width / contentW;
        var contentHpx = Math.round(contentH * pxPerMm);

        // 标记每一行是否“全白”
        var fctx = full.getContext("2d");
        var data = fctx.getImageData(0, 0, full.width, full.height).data;
        var whiteRows = new Uint8Array(full.height);
        for (var yy = 0; yy < full.height; yy++) {
          var rowWhite = true;
          var base = yy * full.width * 4;
          for (var xx = 0; xx < full.width; xx++) {
            var p = base + xx * 4;
            if (data[p] < 250 || data[p + 1] < 250 || data[p + 2] < 250) { rowWhite = false; break; }
          }
          whiteRows[yy] = rowWhite ? 1 : 0;
        }

        var y0 = 0, page = 0;
        while (y0 < full.height) {
          if (page > 0) { pdf.addPage(); }
          var targetEnd = Math.min(y0 + contentHpx, full.height);
          var cutY = targetEnd;
          if (targetEnd < full.height) {
            var searchTo = y0 + Math.floor(contentHpx * 0.3);
            for (var sy = targetEnd; sy >= searchTo; sy--) {
              if (whiteRows[sy]) { cutY = sy; break; }
            }
          }
          if (cutY <= y0) { cutY = targetEnd; }
          var sliceH = cutY - y0;
          var slice = document.createElement("canvas");
          slice.width = full.width; slice.height = sliceH;
          slice.getContext("2d").drawImage(full, 0, y0, full.width, sliceH, 0, 0, full.width, sliceH);
          var sliceHmm = sliceH / pxPerMm;
          pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, contentW, sliceHmm);
          y0 = cutY;
          page++;
        }

        pdf.save((name || "出题") + ".pdf");
        setStatus("PDF 已生成并开始下载 ✓", false);
      } catch (e) {
        setStatus("生成 PDF 失败：" + (e && e.message ? e.message : e), true);
      } finally {
        hideLoading();
        document.body.removeChild(holder);
        btn.disabled = false;
      }
    }

    $("exportImg").addEventListener("click", exportImage);
    $("exportPdf").addEventListener("click", openNameModal);
    $("nameOk").addEventListener("click", function () {
      var name = ($("pdfName").value || "").trim() || "出题";
      closeNameModal();
      doExportPdf(name);
    });
    $("nameCancel").addEventListener("click", closeNameModal);
    $("nameModal").addEventListener("click", function (e) { if (e.target === $("nameModal")) { closeNameModal(); } });
    $("pdfName").addEventListener("keydown", function (e) { if (e.key === "Enter") {
      var name = ($("pdfName").value || "").trim() || "出题";
      closeNameModal();
      doExportPdf(name);
    } });
    $("closeModal").addEventListener("click", function () { $("imgModal").classList.remove("show"); });
    $("imgModal").addEventListener("click", function (e) { if (e.target === $("imgModal")) { $("imgModal").classList.remove("show"); } });

    // ---------- 密钥管理（存本机浏览器，不上传仓库） ----------
    function openKeyModal(msg) {
      $("keyInput").value = API_KEY || "";
      $("keyErr").textContent = msg || "";
      $("keyModal").classList.add("show");
      setTimeout(function () { $("keyInput").focus(); }, 50);
    }
    function closeKeyModal() {
      $("keyModal").classList.remove("show");
      $("keyErr").textContent = "";
    }
    function saveKey() {
      var v = ($("keyInput").value || "").trim();
      if (!v) { $("keyErr").textContent = "密钥不能为空。"; return; }
      API_KEY = v;
      storeStoredKey(v);
      closeKeyModal();
      setStatus("密钥已保存到本机浏览器 ✓（仅本设备有效）", false);
    }
    function clearKey() {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      try { document.cookie = LS_KEY + "=; max-age=0; path=/; SameSite=Lax"; } catch (e) {}
      API_KEY = "";
      $("keyInput").value = "";
      $("keyErr").textContent = "已清除本机保存的密钥。";
      setStatus("已清除本机保存的密钥，请粘贴新密钥后点「保存密钥」。", false);
    }
    $("keyBtn").addEventListener("click", function () { openKeyModal(); });
    $("keySave").addEventListener("click", saveKey);
    $("keyClear").addEventListener("click", clearKey);
    $("keyCancel").addEventListener("click", closeKeyModal);
    $("keyModal").addEventListener("click", function (e) { if (e.target === $("keyModal")) { closeKeyModal(); } });
    $("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { saveKey(); } });

    // 快/慢模型切换
    var segBtns = document.querySelectorAll("#modelSeg .seg-btn");
    for (var i = 0; i < segBtns.length; i++) {
      segBtns[i].addEventListener("click", function () {
        currentModel = (this.getAttribute("data-model") === "slow") ? MODEL_SLOW : MODEL_FAST;
        for (var j = 0; j < segBtns.length; j++) {
          segBtns[j].classList.toggle("active", segBtns[j] === this);
        }
      });
    }

    // ---------- 拍照识别题目（仿例题模式） ----------
    var OCR_PROMPT = [
      "请把这张图片里的数学题目完整、准确地转录成文字，作为「仿例题出题」的例题。",
      "要求：",
      "1. 只输出题目原文：题干、选项，以及图片里已经出现的答案/解析（若有）都要转录。",
      "2. 数学公式、分式、根号、指数、几何记号一律转成 LaTeX，行内用 $...$，独立公式用 $$...$$。",
      "3. 不要添加任何解释、点评或多余文字，也不要解答题目，只做忠实转录。",
      "4. 若图中有多道题，请全部转录，并保留/补全题号。",
      "5. 若图片模糊、空白或没有题目，只回复「未能识别」。"
    ].join("\n");

    function contentToText(c) {
      if (typeof c === "string") return c;
      if (Array.isArray(c)) {
        var parts = [];
        for (var i = 0; i < c.length; i++) {
          if (c[i] && typeof c[i].text === "string") parts.push(c[i].text);
        }
        return parts.join("");
      }
      return "";
    }

    function readFileAsDataUrl(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = function () { reject(new Error("读取图片失败")); };
        reader.readAsDataURL(file);
      });
    }

    function compressImageDataUrl(dataUrl, maxDim, quality) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (!w || !h) { reject(new Error("图片无法解析")); return; }
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          try {
            canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
            resolve(canvas.toDataURL("image/jpeg", quality));
          } catch (e) { reject(e); }
        };
        img.onerror = function () { reject(new Error("图片无法解析")); };
        img.src = dataUrl;
      });
    }

    function ocrViaApi(dataUrl) {
      return new Promise(function (resolve, reject) {
        var headers = { "Content-Type": "application/json" };
        if (API_KEY) { headers["Authorization"] = "Bearer " + API_KEY; }
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 120000);
        fetch(API_URL, {
          method: "POST",
          headers: headers,
          signal: controller.signal,
          body: JSON.stringify({
            model: MODEL_VISION,
            messages: [
              { role: "user", content: [
                { type: "text", text: OCR_PROMPT },
                { type: "image_url", image_url: { url: dataUrl } }
              ] }
            ],
            temperature: 0.2,
            max_tokens: 2048,
            stream: false
          })
        }).then(function (resp) {
          clearTimeout(timer);
          if (!resp.ok) {
            return resp.text().then(function (t) {
              reject(new Error("识别接口返回 " + resp.status + "：" + t.slice(0, 200)));
            }, function () {
              reject(new Error("识别接口返回 " + resp.status));
            });
          }
          return resp.json();
        }).then(function (data) {
          if (!data) { return; }
          var msg = (data.choices && data.choices[0] && data.choices[0].message) || {};
          resolve(contentToText(msg.content).trim());
        }).catch(function (e) {
          clearTimeout(timer);
          reject(e);
        });
      });
    }

    var TESSERACT_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    function ensureTesseract() {
      return new Promise(function (resolve, reject) {
        if (window.Tesseract) { resolve(); return; }
        var s = document.createElement("script");
        s.src = TESSERACT_CDN;
        s.onload = function () { resolve(); };
        s.onerror = function () { reject(new Error("本地识别组件加载失败（网络问题）")); };
        document.head.appendChild(s);
      });
    }
    async function ocrViaTesseract(imageDataUrl) {
      await ensureTesseract();
      var worker = await Tesseract.createWorker("chi_sim");
      try {
        var ret = await worker.recognize(imageDataUrl);
        var text = (ret && ret.data && ret.data.text) ? ret.data.text : "";
        return text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
      } finally {
        try { await worker.terminate(); } catch (e) {}
      }
    }

    async function handlePhotoFile(file) {
      if (!file) return;
      if (!/^image\//.test(file.type || "")) { setStatus("请选择图片文件（jpg / png 等）。", true); return; }
      try {
        var raw = await readFileAsDataUrl(file);
        var dataUrl = await compressImageDataUrl(raw, 1600, 0.85);

        $("photoImg").src = dataUrl;
        $("photoPreview").style.display = "flex";
        $("photoStatus").textContent = "正在识别…";

        showLoading("正在识别题目…");
        setStatus("正在识别题目，请稍候…", false);

        var text = "";
        try {
          text = await ocrViaApi(dataUrl);
        } catch (apiErr) {
          var apiMsg = (apiErr && apiErr.message) ? apiErr.message : String(apiErr);
          if (apiMsg.indexOf("modeldisabled") !== -1 || apiMsg.indexOf("30003") !== -1) {
            $("photoStatus").textContent = "视觉模型不可用，改用本地识别…";
            setStatus("视觉模型不可用（该模型在你的账号被禁用），已自动改用本地识别，请稍候。", false);
          } else {
            $("photoStatus").textContent = "接口识别失败，改用本地识别…";
            setStatus("接口识别失败，已自动改用本地识别，请稍候。", false);
          }
          $("loadingText").textContent = "正在本地识别…（首次使用需下载识别组件，请耐心等待）";
          text = await ocrViaTesseract(dataUrl);
        }

        text = (text || "").trim();
        if (!text || text === "未能识别") {
          $("photoStatus").textContent = "未能识别，请重拍或换一张";
          setStatus("未能识别题目，请重新拍摄（光线充足、对准题目、避免反光/倾斜）。", true);
          return;
        }

        $("input").value = text;
        $("photoStatus").textContent = "已识别 ✓ 请核对后点「开始出题」";
        setStatus("已识别并填入输入框，请核对无误后点「开始出题」。", false);
      } catch (e) {
        $("photoStatus").textContent = "识别失败";
        if (e && e.name === "AbortError") {
          setStatus("识别超时，请重试或改为手动输入。", true);
        } else {
          setStatus("识别失败：" + (e && e.message ? e.message : e), true);
        }
      } finally {
        hideLoading();
      }
    }

    $("photoBtn").addEventListener("click", function () { $("cameraInput").click(); });
    $("galleryBtn").addEventListener("click", function () { $("galleryInput").click(); });
    $("cameraInput").addEventListener("change", function () { handlePhotoFile(this.files && this.files[0]); this.value = ""; });
    $("galleryInput").addEventListener("change", function () { handlePhotoFile(this.files && this.files[0]); this.value = ""; });
    $("photoClear").addEventListener("click", function () {
      $("photoPreview").style.display = "none";
      $("photoImg").src = "";
      $("photoStatus").textContent = "";
    });

    // 初始化
    switchMode("exam");
    if (!API_KEY && !cfg.proxyUrl) { openKeyModal("首次使用请粘贴你的硅基流动密钥（只保存在本机浏览器）。"); }
  })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
